tuhan/waktu."]],"cta":"Buka beranda saya","target":"H","kind":"cards"},{"key":"H","title":"Ruang tarbiyah Anda","sub":"Selamat kembali. Satu langkah kecil sudah berarti.","cards":[["P1 Mulai   P2 Fase   P3 Bakat","P4 Keluarga   P5 Lembaga & Guru   P6 Dalil"],["Respons krisis cepat","Fitur bantuan emosi, bukan pilar baru.\nBuka K untuk kalimat satu jempol."],["Lead • kurang dari 10 detik","Tenangkan diri sebelum memberi batasan.\nContoh respons ada di F."],["Untuk amanah Anda","Primer: N • Guru: T1–T5 • Rubrik: R1\nLembaga: L1–L3 • Dalil: D1–D3\nTB40: B1 • Malam: A1 / J"],["Audio tersimpan","Lanjutkan audio di latar belakang • A3"]],"cta":"Mulai deck 5 langkah","target":"Dk1","kind":"cards"},{"key":"F","title":"Mode Eksekutif • 3 menit","sub":"01a Ayah • P4 Keluarga / P2 Fase","cards":[["Prinsip • 10 detik","Hadir dengan tenang. Dengarkan alasan anak sebelum menyepakati tindakan berikutnya."],["Contoh ucapan","“Ayah ingin memahami apa yang membuatmu menunda. Mari bersiap bersama.”"],["Batas & rujukan","Contoh pedagogis, bukan fatwa. Rujukan usia 7/10 harus ditelaah di D2; jangan melukai atau mempermalukan anak."],["Dialog akhir pekan","Apa yang kamu syukuri? Apa yang sulit? Apa yang dapat kita lakukan bersama?"]],"cta":"Simpan ucapan • buka bookmark","target":"S1","kind":"cards"},{"key":"K","title":"Tenang dulu, Bunda","sub":"01b • Pusat Krisis Emosi Cepat","cards":[["Anda tidak sendirian","Utamakan keamanan anak dan beri ruang emosi. Tidak perlu ceramah panjang sekarang."],["Ucapkan perlahan","“Bunda tahu kamu kecewa. Bunda di sini sampai kamu merasa lebih tenang.”"],["Langkah kecil sekarang","Bila anak bersedia, duduk di dekatnya. Hindari memaksa pelukan. Ambil jeda tanpa meninggalkan anak dalam bahaya."],["Dengarkan tanpa memegang layar","Putar contoh respons • A1\nSimpan untuk situasi berikutnya • S1"]],"cta":"Simpan kalimat ini","target":"S1","kind":"crisis"},{"key":"N","title":"Peta 4 fase tarbiyah","sub":"01 Pemula • P1 Mulai / P2 Fase","cards":[["Thufulah • 2–7 tahun","Keamanan, kelekatan, dan bermain."],["Tamyiz • 7–10 tahun","Pembiasaan dan memahami keteraturan."],["Murahaqah • 10–14 tahun","Dialog, privasi, dan pendampingan pubertas."],["Baligh & Syabab • 14+","Tanggung jawab dan arah kontribusi."],["Fase bukan vonis anak","Ringkasan ilustratif; sesuaikan konteks bersama pendidik."]],"cta":"Buka primer 5 hari","target":"N2","kind":"cards"},{"key":"N2","title":"Primer orang tua • 5 hari","sub":"Tidak ada hukuman bila jeda belajar.","cards":[["Hari 1 • Fitrah keimanan","Buka Dk1; satu konsep dan tindakan kecil."],["Hari 2 • Tangki cinta","Hadir, dengarkan, dan refleksikan."],["Hari 3 • Keteladanan","Sepakati satu contoh bersama pasangan."],["Hari 4 • Tiga bahasa mendidik","Tubuh tenang, kata santun, tindakan nyata."],["Hari 5 • Adab sehari-hari","Pilih satu pembiasaan; catat narasi, bukan angka."]],"cta":"Mulai hari yang dipilih","target":"Dk1","kind":"cards"},{"key":"T1","title":"Cerita & sentra bermain","sub":"02a • Thufulah • P5 / P2","cards":[["Apersepsi sirah • 3 menit","Pilih tema kasih sayang. Naskah sirah dan atribusi perlu sumber tervalidasi sebelum digunakan sebagai riwayat."],["Aktivitas kelas","Bermain berbagi balok; guru mencontohkan meminta izin."],["Pertanyaan pemantik","“Siapa yang membuatmu merasa disayangi hari ini?”"],["Komunikasi wali murid","Tujuan: menikmati belajar dan berbagi. Bukan tuntutan calistung dini."],["Catatan observasi","Meletakkan sepatu • Berbagi mainan • R1"]],"cta":"Unduh aktivitas / audio","target":"A2","kind":"cards"},{"key":"T2","title":"Tertib shalat bersama","sub":"02b • Tamyiz • P5 / P2","cards":[["Lead • sebelum Zhuhur","Bangun rutinitas hangat: ajak bersiap, berikan peran, dan dampingi tanpa bentakan."],["Giliran peran kelas","Muazin • Penata alas • Pendamping antrean\nContoh aktivitas, bukan dalil."],["Apersepsi adab & sains","Amati penggunaan air saat wudhu; diskusikan sikap tidak berlebihan."],["Catat yang terlihat","Wudhu tertib • Kejujuran • R1"],["Inspirasi sirah","Sumber cerita shahabat perlu telaah D2 sebelum unduh."]],"cta":"Catat observasi kelas","target":"R1","kind":"cards"},{"key":"T3","title":"Mediasi dengan menjaga martabat","sub":"02c • Murahaqah • P5 / P2","cards":[["1. Dengarkan terpisah","Tabayyun tanpa mempermalukan di depan teman."],["2. Sepakati pemulihan","Catat kejadian, kebutuhan masing-masing, dan tindak lanjut tanpa kekerasan."],["3. Lindungi privasi","Pembicaraan pubertas tidak dibagikan ke grup kelas."],["Panduan thaharah santun","Mimpi basah / haid: buka T3b. Materi fiqih wajib ditelaah ahli."]],"cta":"Buka panduan thaharah","target":"T3b","kind":"cards"},{"key":"T3b","title":"Thaharah • ruang privat","sub":"Privasi peserta lebih penting dari rasa ingin tahu.","cards":[["Bertanya dengan aman","Sediakan waktu konsultasi pribadi dan pilihan pendamping yang sesuai."],["Topik yang dibahas","Kebersihan • Mimpi basah • Haid • Kewajiban ibadah\nContoh struktur materi, bukan petunjuk fiqih final."],["Rujukan dan batas","Tautkan dalil, syarah, dan konteks di D2. Jangan menyimpulkan hukum dari ilustrasi desain."],["Tindak lanjut","Catat kebutuhan belajar tanpa detail intim; kembali ke mediasi T3."]],"cta":"Simpan rencana pendampingan","target":"E1","kind":"cards"},{"key":"T4","title":"Mentoring pemuda","sub":"02d • Syabab • P3 Bakat / P5","cards":[["Empat kluster TB40","Al-Qiyadah • Al-Fashahah\nAl-Idarah • Al-Fikriyyah"],["Eksplorasi, bukan label","Mulai 5 pertanyaan B1. Hasil contoh tidak memakai algoritme asesmen tervalidasi."],["Iffah di ruang digital","Sepakati batas penggunaan media dan dukungan teman. Buka T4b."],["Rencana kontribusi","Satu minat, satu tugas nyata, satu waktu evaluasi bersama mentor • B7"]],"cta":"Mulai eksplorasi TB40","target":"B1","kind":"cards"},{"key":"T4b","title":"Menjaga iffah bersama","sub":"Pendampingan tanpa membuka aib peserta.","cards":[["Kenali pemicu","Refleksikan konten dan situasi yang membuat batas terasa sulit."],["Pilih tindakan praktis","Kurasi akun, ambil jeda layar, dan alaqqi","Makhraj dan bacaan bersama pembimbing; desain tidak memainkan rekaman adzan."]]},{"key":"GF_GARDEN","name":"Hadiqatul Fitrah","label":"Taman alam","scene":"garden","activities":[["Bermain bebas","Pasir, lumpur, batang panjat dan ayunan; eksplorasi motorik dengan pendamping."],["Kebun belajar","Kurma, tin, zaitun, delima dan bidara; menyiram dan mengamati alam."],["Arena olahraga","Lintasan, panahan didampingi dan kolam dengan jadwal privat terpisah."]]},{"key":"GF_MARKET","name":"Suq Al-Madinah","label":"Pasar niaga","scene":"market","activities":[["Lapak karya Syabab","Kerajinan, roti, jurnal dan madu; eksplorasi kontribusi TB40."],["Timbangan amanah","Transaksi saling rela, takaran jujur dan tanpa riba."],["Kas komunitas","Pilihan berbagi hasil karya; ekonomi virtual bukan uang nyata."]]},{"key":"GF_DORM","name":"Ma’had As-Sakinah","label":"Asrama santri","scene":"dorm","activities":[["Ranjang tertib","Rapikan selimut, jaga kamar mandi bersama dan ritme sebelum Subuh."],["Mediasi privat","Musyrif mendengar fakta terpisah, membantu tenang dan merancang pemulihan."],["Kemandirian aman","Batas jelas tanpa kekerasan; privasi pubertas dijaga."]]},{"key":"GF_NEIGHBOUR","name":"Jiran Salih","label":"Lingkungan tetangga","scene":"neighbour","activities":[["Berbagi makanan","Minta izin mengantar kuah masakan; cek kebutuhan dan alergi tetangga."],["Menjenguk dengan izin","Salam dan kabar, hormati pilihan tuan rumah untuk tidak menerima kunjungan."],["Pos warga","Saling membantu, tanpa membagikan data keluarga atau membuka aib."]]}],"scenarios":[{"title":"Ayunan diperebutkan","venue":"garden","body":"Zaid menangis saat temannya memakai ayunan. Mereka aman bersama Bunda.","choices":[["Dengar lalu sepakati giliran","“Kamu ingin bermain juga. Kita dengarkan teman lalu cari giliran yang adil.”","Avatar merasa didengar; kedua anak menyepakati giliran dengan bantuan.","Koneksi sebelum batas; kebutuhan keduanya dihormati."],["Langsung atur giliran","Bunda membagi waktu tanpa bertanya apa yang terjadi.","Ayunan bergantian, tetapi Zaid masih ingin menjelaskan.","Batas membantu; tambah tabayyun dan validasi agar anak didengar."],["Tunda dialog sejenak","Bunda menjaga mereka aman, mengajak tenang lalu kembali berbicara.","Konflik belum selesai, tetapi emosi lebih tenang dan keputusan tetap menunggu.","Jeda aman sah; jangan tinggalkan anak dalam bahaya."]]},{"title":"Koin kantin belum dibayar","venue":"school","body":"Kotak amanah kurang koin. Guru belum tahu alasan Zaid.","choices":[["Tabayyun secara privat","“Aku melihat koinnya belum masuk. Ceritakan apa yang terjadi.”","Zaid mengaku lupa; guru mendampingi pembayaran dan perbaikan.","Periksa fakta tanpa memberi label pencuri atau mempermalukan."],["Ingatkan transaksi","Guru menunjukkan kotak koin dan mengajak memeriksa bersama.","Pembayaran selesai; alasan kejadian belum dipahami.","Tindakan konkret baik; beri ruang penjelasan untuk memahami kebutuhan."],["Tunda dengan pendamping","Guru mencatat kewajiban contoh dan menemani Zaid berbicara saat tenang.","Transaksi menunggu, makanan tidak dijadikan ancaman.","Jaga martabat dan sepakati tindak lanjut yang jelas."]]},{"title":"Belum ingin bersiap shalat","venue":"home","body":"Avatar Tamyiz masih asyik bermain. Ayah hendak mengajak bersiap.","choices":[["Ajak dan berikan peran","“Mau menata alas atau mengambil air bersama Ayah?”","Zaid memilih menata alas lalu bersiap dengan pendamping.","Pembiasaan menggembirakan tanpa ancaman atau kekerasan."],["Beri pengingat jelas","Ayah mengingatkan waktu bersiap dengan suara tenang.","Zaid mendengar, tetapi masih membutuhkan bantuan transisi.","Pengingat adalah awal; tawarkan langkah kecil dan dampingi."],["Dengar kesulitannya","“Apa yang sulit untuk berhenti bermain sekarang?”","Zaid meminta menyimpan mainan dulu; transisi disepakati.","Dialog tidak menghapus batas, tetapi membantu menjalaninya."]]},{"title":"Privasi kamar remaja","venue":"dorm","body":"Avatar Murahaqah tidak nyaman saat barang pribadinya dibuka teman.","choices":[["Dengar terpisah dan jaga izin","Musyrif mendengar masing-masing, lalu menyepakati izin sebelum menyentuh barang.","Kedua avatar memahami batas dan merencanakan pemulihan.","Privasi dan martabat dilindungi; tidak menuntut detail intim."],["Rapikan ruang lebih dulu","Musyrif menyediakan penyimpanan terpisah dan menunda dialog.","Barang aman; perasaan dan kesepakatan masih perlu dibahas.","Solusi ruang membantu, tetapi bukan pengganti mendengarkan."],["Tawarkan mediasi nanti","Musyrif memberi ruang aman dan pilihan waktu mediasi.","Keduanya lebih tenang; rekonsiliasi tidak dipaksa.","Perbaikan bertahap, bukan pemaksaan permaafan."]]},{"title":"Karya belum menemukan pembeli","venue":"market","body":"Avatar Syabab kecewa karena kerajinannya belum terjual.","choices":[["Dengar lalu eksplorasi ide","Mentor bertanya apa yang dinikmati dan bantuan yang dibutuhkan.","Avatar mencoba cara bercerita tentang karya tanpa membandingkan diri.","Arah syakilah ditumbuhkan lewat minat dan dukungan, bukan nilai jual saja."],["Tinjau rencana dagang","Mentor membantu harga, takaran dan deskripsi jujur.","Rencana menjadi jelas; kekecewaan tetap perlu didengar.","Amanah niaga penting; jangan mengabaikan emosi."],["Jeda tanpa menyerah","Avatar boleh beristirahat dan kembali mencoba di lain waktu.","Energi pulih; lapak dan karya tetap aman tanpa tenggat.","Istirahat bukan kegagalan; tidak ada tekanan mengejar hadiah."]]}],"disclaimer":"Simulasi avatar, bukan pengukuran cinta, iman, nafs, atau adab anak nyata.","ownedPages":["Virtual Fitrah • Mobile","Virtual Fitrah • Companion","Virtual Fitrah • Components"],"implementation":"design-only","typography":{"version":1,"styles":[{"name":"Display","fontFamily":"Inter","fontSize":26,"fontWeight":700,"lineHeight":36,"letterSpacing":0},{"name":"Heading","fontFamily":"Inter","fontSize":18,"fontWeight":700,"lineHeight":27,"letterSpacing":0},{"name":"Subhead","fontFamily":"Inter","fontSize":15,"fontWeight":400,"lineHei function refs(text){const p=el('p');const pattern=/\b(?:Dk[1-5]|Dkf|T3b|T4b|L[1-3][bc]?|R[1-5]|B[1-7]|D[1-3]|A[1-3]|S[01]|O[1-4]|E[1-3]|N2|T[1-5]|F|K|H|J|N)\b/g;let at=0;for(const match of text.matchAll(pattern)){if(!screens.has(match[0]))continue;p.append(document.createTextNode(text.slice(at,match.index)));const b=button(match[0],()=>go(match[0]),'inline-ref');b.setAttribute('aria-label','Buka '+screens.get(match[0]).title);p.append(b);at=match.index+match[0].length;}p.append(document.createTextNode(text.slice(at)));return p;}

function sourceCard(){const card=el('section',undefined,'card');card.append(el('h3','Nash • kutipan bersumber'));const arabic=el('p',data.source.arabic,'arabic');arabic.lang='ar';arabic.dir='rtl';card.append(arabic,el('p',data.source.translation));const a=el('a',data.source.attribution,'source-link');a.href=data.source.url;a.target='_blank';a.rel='noopener noreferrer';card.append(a);return card;}
function radar(){const card=el('section',undefined,'card');card.append(el('h3','Peta kluster ilustratif • tanpa skor'));const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 320 230');svg.setAttribute('class','chart');svg.setAttribute('role','img');svg.setAttribute('aria-label','Empat arah kontribusi setara. Ilustrasi, bukan hasil asesmen atau skor.');for(const size of [35,60,85]){const p=document.createElementNS(ns,'polygon');p.setAttribute('points','160,'+(115-size)+' '+(160+size)+',115 160,'+(115+size)+' '+(160-size)+',115');p.setAttribute('fill','none');p.setAttribute('stroke','currentColor');p.setAttribute('opacity','.25');svg.append(p);}for(const [x,y]of [[160,30],[245,115],[160,200],[75,115]]){const l=document.createElementNS(ns,'line');for(const [k,v]of Object.entries({x1:160,y1:115,x2:x,y2:y,stroke:'currentColor',opacity:'.3'}))l.setAttribute(k,v);svg.append(l);}const shape=document.createElementNS(ns,'polygon');shape.setAttribute('points','160,55 220,115 160,175 100,115');shape.setAttribute('fill','currentColor');shape.setAttribute('fill-opacity','.1');shape.setAttribute('stroke','currentColor');svg.append(shape);const labels=['Qiyadah','Fashahah','Idarah','Fikriyyah'];for(const [i,[x,y]]of [[160,18],[274,119],[160,222],[43,119]].entries()){const t=document.createElementNS(ns,'text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('text-anchor','middle');t.textContent=labels[i];svg.append(t);}card.append(svg,el('p','Bentuk simetris untuk mengenalkan empat kluster. Tidak dihitung dari jawaban Anda.'));return card;}
function formatTime(time){return Math.floor(time/60).toString().padStart(2,'0')+':'+Math.floor(time%60).toString().padStart(2,'0');}
function audioPanel(){const panel=el('section',undefined,'card audio-panel');panel.append(el('h3','Pemutar demo'));panel.append(el('p','Simulasi kontrol saja. Tidak ada aset audio, suara, unduhan nyata, atau pemutaran latar belakang.','demo-label'));const clock=el('p',undefined);clock.id='audio-clock';panel.append(clock);const seek=el('input');seek.type='range';seek.min=0;seek.max=420;seek.value=state.audio.time;seek.id='audio-seek';seek.setAttribute('aria-label','Posisi pemutar demo');seek.oninput=()=>{state.audio.time=Number(seek.value);audioClock();};panel.append(seek);const transport=el('div',undefined,'transport');transport.append(button('−15 dtk',()=>{state.audio.time=Math.max(0,state.audio.time-15);audioClock();}),button(state.audio.playing?'Jeda':'Putar',()=>{state.audio.playing=!state.audio.playing;render(false);}),button('+15 dtk',()=>{state.audio.time=Math.min(420,state.audio.time+15);audioClock();}));panel.append(transport);const speed=el('select');speed.setAttribute('aria-label','Kecepatan demo');for(const value of [.75,1,1.25,1.5,2]){const o=el('option',value+'×');o.value=value;o.selected=value===state.audio.speed;speed.append(o);}speed.onchange=()=>state.audio.speed=Number(speed.value);panel.append(speed);panel.append(button(state.audio.transcript?'Tutup transkrip':'Lihat transkrip',()=>{state.audio.transcript=!state.audio.transcript;render(false);}));if(state.audio.transcript)panel.append(el('p',screens.get('A1').cards[0][1]));if(state.key==='A2'){panel.append(el('p','Unduhan demo: '+({idle:'belum dimulai',loading:'berlangsung',ready:'tersimpan (simulasi)',cancelled:'dibatalkan'}[state.audio.download])));panel.append(button(state.audio.download==='loading'?'Batalkan demo unduh':'Simulasikan unduh',()=>{clearTimeout(downloadTimer);if(state.audio.download==='loading'){state.audio.download='cancelled';render(false);return;}state.audio.download='loading';render(false);downloadTimer=setTimeout(()=>{state.audio.download='ready';if(state.key==='A2')render(false);announce('Unduhan demo selesai • tidak ada file disimpan');},1800);}));}return panel;}
function audioClock(){if($('audio-clock'))$('audio-clock').textContent=formatTime(state.audio.time)+' / 07:00 • '+(state.audio.playing?'Demo berjalan':'Demo dijeda');if($('audio-seek'))$('audio-seek').value=state.audio.time;}
setInterval(()=>{if(state.audio.playing){state.audio.time=Math.min(420,state.audio.time+state.audio.speed);if(state.audio.time===420){state.audio.playing=false;if(screens.get(state.key).kind==='audio')render(false);}audioClock();}},1000);
function render(resetScroll=true){const s=screens.get(state.key);const content=$('content');const oldScroll=content.scrollTop;content.replaceChildren();$('app').classList.toggle('tablet',['L1','R1'].includes(s.key));$('back').disabled=state.history.length===0;updateBookmark();$('flows').querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-current',String(i===state.flow)));$('flow-select').value=state.flow;content.append(el('h2',s.title),el('p',s.sub,'subtitle'));if(/^Dk[1-5]$/.test(s.key)||s.key==='Dkf'){const line=el('div',undefined,'steps-line');const step=s.key==='Dkf'?3:Number(s.key.slice(2));line.setAttribute('aria-label','Langkah '+step+' dari 5');for(let i=1;i<=5;i++)line.append(el('span',undefined,i<=step?'done':''));content.append(line);}const cards=el('div',undefined,'cards');if(['D2','Dk2'].includes(s.key)&&data.source)cards.append(sourceCard());if(s.key==='B6')cards.append(radar());if(s.key==='S1'||s.key==='S0'){if(!state.saved.size){const empty=el('section',undefined,'card');empty.append(el('h3','Belum ada bookmark'),el('p','Simpan layar dengan tombol Simpan. Bookmark hanya ada selama sesi demo ini.'));cards.append(empty);}for(const key of state.saved){const saved=screens.get(key);const card=el('section',undefined,'card');card.append(el('h3',saved.title));const row=el('div',undefined,'bookmark-row');row.append(button('Buka',()=>go(key)),button('Hapus',()=>{state.saved.delete(key);render(false);announce('Bookmark dihapus • simulasi');}));card.append(row);cards.append(card);}}else s.cards.forEach(([title,body],i)=>{const card=el('section',undefined,'card'+(s.kind==='crisis'||title.includes('Lead')?' lead':''));card.append(el('h3',title));const option=s.kind==='options'&&(s.key.startsWith('B')?i>0&&i<s.cards.length-1:true);if(option){const choice=button(body,()=>{state.choices.set(s.key,title);render(false);},'btn choice');choice.setAttribute('role','radio');choice.setAttribute('aria-checked',String(state.choices.get(s.key)===title));choice.setAttribute('aria-label',title);card.append(choice);}else if(s.kind==='rubric'){card.append(el('p',body));const row=el('div',undefined,'rubric');row.setAttribute('role','group');row.setAttribute('aria-label',title);for(const value of ['BT','MT','BK','MM','—']){const key=s.key+':'+i;const b=button(value,()=>{state.rubric.set(key,value);render(false);});b.setAttribute('aria-pressed',String((state.rubric.get(key)||'—')===value));row.append(b);}card.append(row);}else card.append(refs(body));if(['J','R4','L1','L1b','L2b','B7'].includes(s.key)&&!title.includes('Privasi')&&!title.includes('Periksa'))field(card,s.key+':'+i,'Catatan Anda • simulasi',body);if(s.kind==='quiz'&&i===0){const answers=body.match(/[ABC]\. [^\n]+/g)||[];for(const answer of answers){const b=button(answer,()=>{state.choices.set(s.key,answer[0]);if(answer[0]==='B')go('Dkf');else announce('Coba respons yang mendengarkan dan menjaga martabat.');});b.setAttribute('aria-pressed',String(state.choices.get(s.key)===answer[0]));card.append(b);}}cards.append(card);});content.append(cards);if(s.kind==='audio')content.append(audioPanel());if(['J','R4','L1','L1b','L2b','B7'].includes(s.key))content.append(el('p','Tulisan disimpan dalam memori sesi demo saja, bukan penyimpanan aplikasi.','demo-label'));content.append(el('p',s.key+' • prototipe interaktif','screen-key'));$('cta').textContent=s.cta;$('cta').onclick=()=>{if(s.target==='S1'){state.saved.add(s.key);announce('Bookmark disimpan • simulasi');}if(s.target==='E1')announce('Catatan tersimpan dalam sesi demo • simulasi');if(s.kind==='quiz')state.choices.set(s.key,'B');go(s.target);};$('cta').hidden=!s.cta||!s.target;renderNav();audioClock();content.scrollTop=resetScroll?0:oldScroll;}

 if(type==='mosque'){isoBox(g,90,113,145,80,48);shape(g,'path',{d:'M113 82Q153 15 197 100Z',fill:'var(--Primary)',stroke:'var(--Primary)'});isoBox(g,255,100,25,22,100);shape(g,'ellipse',{cx:257,cy:7,rx:17,ry:8,fill:'var(--Primary)'});for(let i=0;i<3;i++)shape(g,'path',{d:'M105 '+(139+i*12)+'l75 38',stroke:'var(--Primary)','stroke-width':3});person(g,224,172);}
 if(type==='garden'){for(const [x,y]of [[72,102],[262,115],[294,171]])tree(g,x,y);for(let i=0;i<3;i++)isoBox(g,124+i*24,145+i*9,20,12,5,'var(--Primary)');shape(g,'path',{d:'M82 165v-62h74v98M105 105v51m28-51v60M103 157l32 9',stroke:'var(--Primary)','stroke-width':4,fill:'none'});shape(g,'ellipse',{cx:224,cy:196,rx:45,ry:19,fill:'var(--PrimarySoft)',stroke:'var(--Primary)'});person(g,176,182);}

function scenePanel(s){const panel=el('section',undefined,'card game-scene');panel.dataset.scene=s.scene.type;panel.append(el('h3',data.game?.venues?.find(v=>v.key===s.scene.venue)?.name||s.title));const svg=shape(panel,'svg',{viewBox:s.scene.type==='map'?'0 0 720 520':'0 0 360 260',class:'game-scene-svg',role:'group','aria-label':s.title+' • pemandangan isometrik editable'});shape(svg,'polygon',{points:s.scene.type==='map'?'360,8 706,180 360,512 14,180':'180,23 348,105 180,247 12,105',fill:'var(--PrimarySoft)',stroke:'var(--Border)'});
 if(s.scene.type==='map'){(s.scene.venues||[]).forEach((v,i)=>{const x=40+(i%3)*215,y=15+Math.floor(i/3)*153;const g=shape(svg,'g',{transform:'translate('+x+' '+y+') scale(.55)',role:'button',tabindex:0,'aria-label':'Buka '+v.label,'data-target':v.target,'data-venue':v.type});venueDrawing(g,v.type);shape(g,'text',{x:180,y:264,fill:'var(--TextPrimary)','text-anchor':'middle','font-size':21},v.label);shape(g,'rect',{x:30,y:0,width:280,height:280,fill:'transparent','pointer-events':'all'});g.onclick=()=>go(v.target);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(v.target);}};});}
 else{venueDrawing(svg,s.scene.type);if(s.scene.night){shape(svg,'circle',{cx:302,cy:45,r:16,fill:'var(--Surface)',stroke:'var(--Primary)'});shape(svg,'text',{x:180,y:252,'text-anchor':'middle',fill:'var(--TextPrimary)','font-size':12},'Malam • avatar aman bersama pendamping');}for(const room of s.scene.rooms||[]){const b=button(room.label,()=>go(room.target));b.dataset.target=room.target;panel.append(b);}}
 panel.append(el('p','Ilustrasi SVG editable • bukan dunia 3D atau engine otonom.','demo-label'));return panel;}
const avatarDemo={love:68,energy:72,nafs:'Lawwamah',wudhu:'Perlu bersiap'};
function avatarPanel(){const panel=el('section',undefined,'card');panel.id='avatar-simulator';panel.append(el('h3','Status avatar • simulator sesi'));for(const [key,label]of [['love','Tangki Cinta'],['energy','Energi']]){const wrap=el('label',undefined,'form-field');const out=el('span',label+' • '+avatarDemo[key]+'%');const input=el('input');input.type='range';input.min=0;input.max=100;input.value=avatarDemo[key];input.className='range';input.dataset.status=key;input.setAttribute('aria-label',label+' avatar fiksi');input.oninput=()=>{avatarDemo[key]=Number(input.value);out.textContent=label+' • '+input.value+'%';$('avatar-support').textContent=avatarDemo.love<30?'Tawarkan pendampingan hangat; tidak ada hukuman.':'Avatar aman; dukungan dapat ditawarkan tanpa memaksa.';};wrap.append(out,input);panel.append(wrap);}for(const [key,label,values]of [['nafs','Nafs naratif',['Ammarah','Lawwamah','Muthmainnah']],['wudhu','Wudhu avatar',['Perlu bersiap','Siap']]]){const wrap=el('label',undefined,'form-field');wrap.append(el('span',label));const select=el('select',undefined,'select');select.dataset.status=key;select.setAttribute('aria-label',label);for(const value of values){const o=el('option',value);o.value=value;select.append(o);}select.value=avatarDemo[key];select.onchange=()=>avatarDemo[key]=select.value;wrap.append(select);panel.append(wrap);}const p=el('p','Avatar aman; dukungan dapat ditawarkan tanpa memaksa.');p.id='avatar-support';panel.append(p,el('p','Parameter fiksi dapat diubah untuk memperagakan state. Tidak mengukur anak, iman, ruh, kelekatan atau diagnosis; tidak menjalankan AI. Kartu di bawah adalah contoh narasi desain tetap.','demo-label'));return panel;}
render=function(resetScroll=true){baseRender(resetScroll);const s=screens.get(state.key);if(!s.key.startsWith('GF_'))return;const content=$('content');content.dataset.screen=s.key;$('app').classList.add('game');$('app').classList.toggle('tablet',s.scene?.type==='map');const before=content.querySelector('.cards');if(s.scene)content.insertBefore(scenePanel(s),before);if(s.key==='GF_AVATAR')content.insertBefore(avatarPanel(),before);const actions=el('section',undefined,'game-actions flex flex-col gap-3');for(const link of s.links||[]){const b=button(link.label,()=>go(link.target));b.dataset.target=link.target;actions.append(b);}for(const [i,choice]of (s.choices||[]).entries()){const b=button(String.fromCharCode(65+i)+'. '+choice.label,()=>{state.choices.set(s.key,i);go(choice.target);},'btn game-choice');b.dataset.choice=String.fromCharCode(65+i);b.dataset.target=choice.target;b.setAttribute('aria-pressed',String(state.choices.get(s.key)===i));b.append(el('span',choice.body,'choice-body'));actions.append(b);}content.insertBefore(actions,before);if(s.key==='GF_CHECKIN'){const panel=el('section',undefined,'card');panel.id='game-checkin';field(panel,'GF_CHECKIN:reflection','Refleksi sukarela • boleh kosong','');content.insertBefore(panel,before);}content.append(el('p',data.game.disclaimer+' Perubahan dan catatan hanya ada dalam memori halaman ini; tidak dikirim, tidak ada timer AFK, hadiah, penalti, atau penyimpanan aplikasi.','demo-label game-disclaimer'));};
data.flows.forEach((flow,i)=>{$('flows').append(button(flow.name,()=>start(i)));const o=el('option',flow.name);o.value=i;$('flow-select').append(o);});
$('flow-select').onchange=()=>start(Number($('flow-select').value));$('back').onclick=()=>{const key=state.history.pop();if(key)go(key,false);};$('theme').onclick=()=>{state.mode=state.mode==='Light'?'Dark':'Light';theme();};$('bookmark').onclick=()=>{if(state.saved.has(state.key)){state.saved.delete(state.key);updateBookmark();announce('Bookmark dihapus • simulasi');}else save();};
const requested=new URLSearchParams(location.search).get('screen');if(screens.has(requested))state.key=requested;
theme();render();
