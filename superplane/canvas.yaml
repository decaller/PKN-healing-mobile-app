apiVersion: v1
kind: Canvas
metadata:
  name: "PKN Mission Control & Automation"
  description: "Automated ecosystem health monitoring, AI lesson generation trigger, and state tracking for PKN Mobile App"
spec:
  nodes:
    # 1. Manual Run Trigger (allows 1-click execution in the UI)
    - id: "manual-trigger-001"
      name: "Manual Run Trigger"
      type: "TYPE_TRIGGER"
      position:
        x: 100
        "y": 200
      component: "start"
      isCollapsed: false

    # 2. Scheduled Trigger (runs periodically)
    - id: "schedule-trigger-002"
      name: "Hourly Health & Workflow Check"
      type: "TYPE_TRIGGER"
      configuration:
        type: "hours"
        hoursInterval: 1
      position:
        x: 100
        "y": 380
      component: "schedule"
      isCollapsed: false

    # 3. Check PocketBase / Auth Backend
    - id: "check-pocketbase-003"
      name: "Check PocketBase API"
      type: "TYPE_ACTION"
      configuration:
        method: "GET"
        url: "http://localhost:8090/api/health"
        successCodes: "2xx, 4xx"
        timeoutSeconds: 10
      position:
        x: 500
        "y": 280
      component: "http"
      isCollapsed: false

    # 4. Check Qdrant Vector DB
    - id: "check-qdrant-004"
      name: "Check Qdrant DB"
      type: "TYPE_ACTION"
      configuration:
        method: "GET"
        url: "http://localhost:6335/healthz"
        successCodes: "2xx"
        timeoutSeconds: 10
      position:
        x: 950
        "y": 280
      component: "http"
      isCollapsed: false

    # 5. Persist Ecosystem Status in Canvas Memory
    - id: "upsert-ecosystem-status-005"
      name: "Save Ecosystem Status"
      type: "TYPE_ACTION"
      configuration:
        namespace: "pknEcosystemHealth"
        matchList:
          - name: "serviceKey"
            value: "core_stack"
        valueList:
          - name: "serviceKey"
            value: "core_stack"
          - name: "lastCheckedAtUnix"
            value: "{{ int(now().Unix()) }}"
          - name: "pocketbaseStatus"
            value: "online"
          - name: "qdrantStatus"
            value: "online"
      position:
        x: 1450
        "y": 280
      component: "upsertMemory"
      isCollapsed: false

    # 6. Display Operational Summary
    - id: "display-summary-006"
      name: "Operational Summary Card"
      type: "TYPE_ACTION"
      configuration:
        message: "PKN Ecosystem Check Passed at {{ now().Format(\"15:04:05 UTC\") }}. PocketBase & Qdrant are responsive."
        color: "green"
      position:
        x: 1950
        "y": 280
      component: "display"
      isCollapsed: false

  edges:
    - sourceId: "manual-trigger-001"
      targetId: "check-pocketbase-003"
      channel: "default"
    - sourceId: "schedule-trigger-002"
      targetId: "check-pocketbase-003"
      channel: "default"
    - sourceId: "check-pocketbase-003"
      targetId: "check-qdrant-004"
      channel: "success"
    - sourceId: "check-qdrant-004"
      targetId: "upsert-ecosystem-status-005"
      channel: "success"
    - sourceId: "upsert-ecosystem-status-005"
      targetId: "display-summary-006"
      channel: "default"
