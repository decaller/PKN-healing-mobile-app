name: pkn_microlearning_app
description: "A hybrid microlearning executive app combining Deepstash card curation, Empirio business domains, and Google Primer interactive lessons."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.7.2
  shared_preferences: ^2.3.5
  flutter_markdown: ^0.7.5
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/lessons/

